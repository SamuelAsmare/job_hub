name: job_hub
description: A mobile job search and recruitment platform.
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  freezed_annotation: ^3.1.0
  go_router: ^18.1.4

dev_dependencies:
