name: job_hub
description: A mobile job search and recruitment platform.
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  file_picker: ^13.4.1
  flutter:
    sdk: flutter
  flutter_map: ^8.3.2
  flutter_riverpod: ^3.5.0
  freezed_annotation: ^3.1.0
  geolocator: ^14.1.2
  go_router: ^18.1.4
  latlong2: ^0.10.1
  socket_io_client: ^3.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.17.1
  flutter_lints: ^6.0.0
  freezed: ^4.0.3

flutter:
  uses-material-design: true

  assets:
    - assets/images/
